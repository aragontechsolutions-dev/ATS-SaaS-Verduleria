# Blueprint de Render para el backend (NestJS). Deploy: New → Blueprint → este repo.
# Los valores marcados sync:false se cargan a mano en el dashboard (son secretos).
services:
  - type: web
    name: ats-verduleria-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Instala el monorepo y compila solo lo que el backend necesita, en orden:
    # database (genera el cliente Prisma) → cfe → api.
    # --include=dev fuerza las devDependencies (nest CLI, tsc, prisma) que el
    # build necesita; Render/Vercel instalan en modo producción y las omitirían.
    buildCommand: npm install --include=dev && npm run build -w @ats/database && npm run build -w @ats/cfe && npm run build -w @ats/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: "production"
      # Supabase — pooler (PgBouncer, puerto 6543) para runtime.
      - key: DATABASE_URL
        sync: false
      # Supabase — conexión directa (puerto 5432) para migraciones.
      - key: DIRECT_URL
        sync: false
      # Dominio del front en Vercel para restringir CORS (ej. https://ats-pos.vercel.app)
      - key: CORS_ORIGIN
        sync: false
      # Supabase Auth: el backend verifica el token contra /auth/v1/user.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Service-role (SOLO backend): permite que la Consola cree el login del
      # cliente automáticamente al dar de alta una verdulería. Opcional.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # En producción NO se permite resolver el tenant por header (solo token).
      - key: ALLOW_HEADER_TENANT
        value: "false"
      # Facturación del SaaS (crons). Defaults seguros: genera facturas el 1° de
      # cada mes; NO corta morosos automáticamente (poné "true" para activarlo).
      - key: BILLING_AUTO_GENERATE
        value: "true"
      - key: BILLING_AUTO_SUSPEND
        value: "false"
      # FEU / Surtec (facturación electrónica)
      - key: FEU_AMBIENTE
        value: test
      - key: FEU_USERNAME
        sync: false
      - key: FEU_PASSWORD
        sync: false
      - key: CFE_POLLING_INTERVAL_MS
        value: "60000"
